<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>My Mokka</title>
  <!-- Знакът на приложението: плътно жълто + ink „М“ — същият материал като
       CTA-то „Заредих“. Квадратен и непрозрачен: iOS си слага своя squircle, а
       maskable иска пълнеж до ръба. Монограмът стои в централните 56% (полу-
       диагонал 193 px < 205 px = безопасният кръг). НИКОГА светкавица (това е
       марката на Opel), никога кръг/пръстен, никога хром или „свети“, никога до
       думата OPEL. Правилата: docs/design.md, „Идентичност“. -->
  <rect width="512" height="512" fill="#FDDC00"/>
  <path fill="#16181B" transform="translate(256 256) scale(16) translate(-12 -12)"
    d="M3 4H7.2L12 13.2 16.8 4H21v16h-3.4V9.4l-4.5 8.2h-2.2L6.4 9.4V20H3z"/>
</svg>
