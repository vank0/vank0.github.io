<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#232733"/>
      <stop offset="1" stop-color="#08090c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.25" r="0.9">
      <stop offset="0" stop-color="#ffb454" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#ffb454" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pane" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.5"/>
      <stop offset="0.45" stop-color="#fff" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.45"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glow)"/>
  <!-- two panes of glass, one over the other -->
  <rect x="150" y="118" width="232" height="232" rx="46" fill="url(#pane)" stroke="url(#rim)" stroke-width="5" opacity="0.6" transform="rotate(-12 266 234)"/>
  <rect x="134" y="150" width="244" height="244" rx="50" fill="url(#pane)" stroke="url(#rim)" stroke-width="6"/>
  <circle cx="256" cy="272" r="62" fill="none" stroke="#ffb454" stroke-width="14"/>
  <circle cx="256" cy="272" r="22" fill="#ffb454"/>
</svg>
